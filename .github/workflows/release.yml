name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (без префикса v)'
        required: true
        default: '0.1.0'
      engine_url:
        description: 'URL архива с движком zapret (должен содержать bin\winws.exe)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish app
        run: dotnet publish src/ZprtNextGen.App -c Release -o publish/app

      - name: Download engine
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ github.event.inputs.engine_url }}" -OutFile engine.zip

      - name: Extract engine
        shell: pwsh
        run: |
          Expand-Archive -Path engine.zip -DestinationPath engine-src -Force

      - name: Locate engine folder
        shell: pwsh
        run: |
          $winws = Get-ChildItem -Path engine-src -Recurse -Filter winws.exe | Select-Object -First 1
          if (-not $winws) { throw 'bin\winws.exe не найден в engine.zip' }
          $engineRoot = $winws.Directory.Parent.FullName
          New-Item -ItemType Directory -Path engine -Force | Out-Null
          Copy-Item -Path (Join-Path $engineRoot '*') -Destination engine -Recurse -Force

      - name: Pack release
        shell: pwsh
        run: |
          tools\Pack-Release.ps1 -EngineDir engine -Version "${{ github.event.inputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZPRT_NEXT_GEN-${{ github.event.inputs.version }}-win-x64
          path: publish\ZPRT_NEXT_GEN-win-x64.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: publish\ZPRT_NEXT_GEN-win-x64.zip
          generate_release_notes: true
